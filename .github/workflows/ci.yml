name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The GPU legs run on the developer's own workstation. A superseded run left
# queued there is not just wasted minutes, it is a machine somebody is trying to
# work on, so a new push cancels the old run outright.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks first, so a stray timestamp macro or a committed credential
  # stops the run before anyone waits on a compile.
  #
  # This is the one job that does not run on the self-hosted runner. It has to
  # produce an answer when the workstation is off, and a grep over the tree is a
  # minute of the cheapest multiplier GitHub bills. Everything else here needs a
  # real Vulkan device and cannot run on a hosted runner at all.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No committed signing metadata
        shell: bash
        run: |
          # metadata.json is generated from signing.env so the endpoint, account
          # and certificate profile are written down exactly once. Committed
          # copies drifted into three different profile names across four other
          # Locke Werks repositories, which is the reason this guard exists
          # before there is anything here to sign.
          if [ -f signing/metadata.json ]; then
            echo "signing/metadata.json is committed; it is generated by scripts/New-SigningMetadata.ps1"
            exit 1
          fi

      - name: No build timestamps in source
        shell: bash
        run: |
          # A build that embeds the wall clock cannot be reproduced, and a
          # reference implementation that cannot be reproduced cannot referee a
          # GPU kernel. The version resource carries the version, not the date.
          #
          # res/ is in the list because it holds revenant.rc.in, and the version
          # resource is the single most likely place for somebody to reach for
          # __DATE__. The guard scanned core, tools, ui and tests only, so the
          # one file the comment above is actually about was the one file it
          # could not see. The .in suffix matters for the same reason: the
          # template is what gets edited, the generated .rc is never committed.
          dirs=""
          for dir in core tools ui tests res; do
            if [ -d "$dir" ]; then dirs="$dirs $dir"; fi
          done
          if [ -z "$dirs" ]; then
            echo "no source directories found; the checkout is wrong"
            exit 1
          fi
          if grep -rn \
              --include='*.cpp' --include='*.h' --include='*.hpp' \
              --include='*.comp' --include='*.glsl' \
              --include='*.rc' --include='*.rc.in' --include='*.in' \
              -E '__DATE__|__TIME__|__TIMESTAMP__' $dirs; then
            echo "build timestamp macros are not allowed"
            exit 1
          fi

      - name: No credentials
        shell: bash
        run: |
          # Azure Artifact Signing authenticates with a client secret from the
          # environment. The pattern needs a quote straight after the equals
          # sign, so this step's own command line does not match itself.
          # The excluded directories are build output and third-party sources.
          # CI checks out clean and has neither, but the same command run by
          # hand in a working tree would otherwise scan both.
          if grep -rnE 'AZURE_CLIENT_SECRET[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']' \
              --include='*.ps1' --include='*.yml' --include='*.yaml' \
              --include='*.cpp' --include='*.h' --include='*.json' \
              --exclude-dir=build --exclude-dir=vcpkg_installed --exclude-dir=.git . ; then
            echo "a credential appears to be hardcoded"
            exit 1
          fi

      - name: No vendored copyleft source
        shell: bash
        run: |
          # What this guards changed when Revenant took GPL-3.0-or-later so it
          # could link librtlsdr. Linking a copyleft library is now permitted
          # and recorded in docs/clean-room.md; copying its source into this
          # tree is still not, and the two are different acts with different
          # consequences. A linked dependency is a version in vcpkg.json that
          # updates, carries its own copyright and can be swapped out. A pasted
          # file is a fork nobody maintains, with a provenance that has to be
          # reconstructed from memory the first time anyone asks.
          #
          # The first attempt at this matched the licence GRANT a copied file
          # carries in its header. That was wrong twice over, and both were
          # caught by review rather than by anybody hitting them.
          #
          # It rejected Revenant's own files. "This program is free software"
          # is the opening line of the notice that LICENSE itself, under "How
          # to Apply These Terms to Your New Programs", instructs authors to
          # put at the head of every source file. A guard that fails the build
          # for following the project's own licence is worse than no guard: it
          # teaches people that the check is noise.
          #
          # And it missed the crudest paste there is. A file lifted from a
          # kernel tree carries "SPDX-License-Identifier: GPL-2.0" and no
          # grant paragraph at all, so the grant pattern found nothing while
          # the licence name the previous pattern looked for was sitting right
          # there.
          #
          # So the signal is not the licence text. It is WHOSE COPYRIGHT the
          # file carries. A pasted file arrives with its author's copyright
          # line, and removing that line is deliberate laundering rather than
          # the crude case this backstop is for. Revenant's own files carry
          # either Locke Werks or nothing.
          dirs=""
          for dir in core tools ui; do
            if [ -d "$dir" ]; then dirs="$dirs $dir"; fi
          done
          if [ -z "$dirs" ]; then
            echo "none of core/, tools/ or ui/ exist; the checkout is wrong"
            exit 1
          fi

          if grep -rniE 'copyright' $dirs | grep -viE 'Locke Werks'; then
            echo
            echo "a source file carries somebody else's copyright line."
            echo "Link the library through vcpkg and record it in"
            echo "docs/clean-room.md rather than copying it into this tree."
            exit 1
          fi

          # Any SPDX identifier that is not this project's own is either a
          # pasted file or a file whose licence disagrees with LICENSE. Both
          # are worth stopping for.
          if grep -rniE 'SPDX-License-Identifier' $dirs | grep -viE 'GPL-3\.0-or-later'; then
            echo
            echo "a source file declares a licence that is not this project's."
            echo "See docs/clean-room.md."
            exit 1
          fi

      - name: The version parses
        shell: bash
        run: |
          # Everything derives from this file: project(), the VERSIONINFO
          # resource and installer.toml when there is one. A malformed component
          # otherwise surfaces as an unrelated CMake error much later.
          file=cmake/RevenantVersion.cmake
          if [ ! -f "$file" ]; then
            echo "$file is missing"
            exit 1
          fi
          version=""
          for part in MAJOR MINOR PATCH; do
            # The || true is load-bearing. This step runs under bash -e with
            # pipefail, so a grep that matches nothing fails the pipeline, the
            # step dies on the assignment, and the message below never prints.
            # A malformed version file would fail the job with no indication of
            # which component was wrong, which is exactly what this guard exists
            # to tell you.
            value=$(grep -oE "REVENANT_VERSION_${part}[[:space:]]+[0-9]+" "$file" \
                    | head -1 | grep -oE '[0-9]+$' || true)
            if [ -z "$value" ]; then
              echo "$file: REVENANT_VERSION_${part} is missing or is not an integer"
              exit 1
            fi
            version="${version}${version:+.}${value}"
          done
          echo "version parses as $version"

      - name: No retired claim has come back
        shell: bash
        run: |
          # A fact in this tree gets stated in three or four places, because a
          # comment carrying the measurement beside the code is what makes the
          # tree worth reading. Correcting it in one place leaves the others
          # asserting the old thing. Nine of those were found in a single day
          # and the fix for one of them introduced another, so the retraction
          # is what gets recorded: docs/retired-claims.txt lists every phrase
          # that has stopped being true and the check hunts each one.
          #
          # Here rather than only in ctest because this job answers when the
          # GPU workstation is off and answers before anything compiles. The
          # conformance legs run it too, through ctest, which is the copy a
          # developer sees.
          #
          # The self-test goes first. It plants a retired phrase in a fixture
          # and requires the matcher to report it, and plants the same phrase
          # under a retraction marker and requires the matcher to allow it. A
          # ratchet that cannot fail is worse than no ratchet, because it is
          # believed.
          python3 scripts/check_retired_claims.py --self-test
          python3 scripts/check_retired_claims.py

      - name: Every test target suppresses modal dialogs
        shell: bash
        run: |
          # tests/support/no_modal_dialogs.cpp stops a test process opening a
          # window it then sits behind. On a desktop that is a popup somebody
          # dismisses. On the runner it is a job that hangs to its timeout and
          # reports nothing, because the message the process wanted to print is
          # in a dialog no one will see. Nothing links it automatically, so
          # every target lists the path itself and this is what checks that
          # every target did.
          #
          # A SCRIPT RATHER THAN THE AWK THAT WAS HERE. The awk read the target
          # name off the same line as add_executable( and silently skipped any
          # call that put it on the next line, which CMake allows and which the
          # count backstop could never catch while six other targets were being
          # found. scripts/check_modal_dialogs.py has the whole argument and a
          # self-test whose second case is exactly that shape.
          #
          # The self-test goes first, for the reason the retired-claims step
          # gives: a ratchet nobody has watched fail is believed rather than
          # trusted.
          python3 scripts/check_modal_dialogs.py --self-test
          python3 scripts/check_modal_dialogs.py

  # The conformance suite diffs GPU compute kernels against CPU reference
  # implementations. A hosted runner has no discrete GPU, so it cannot execute
  # the one thing this project's correctness argument rests on. The runner is a
  # Windows 11 workstation carrying two real Vulkan devices, and each leg below
  # is bound to one of them.
  build-and-test:
    needs: guards
    name: build-and-test (${{ matrix.name }})
    runs-on: [self-hosted, windows, x64, gpu]
    # NOT ON A FORK. This is the line that stands between a public repository
    # and somebody else's code running on the maintainer's desktop.
    #
    # A self-hosted runner is not a sandbox. It is a persistent machine with a
    # real filesystem, real credentials in the environment and a real network
    # position, and a workflow can run anything. On a private repository that
    # is fine, because only people with write access can trigger one. The
    # moment the repository is public, anyone can fork it, edit a build script
    # or this file, open a pull request and have it execute here. That is a
    # documented and routinely exploited attack, not a theoretical one, and
    # GitHub's own guidance is not to pair self-hosted runners with public
    # repositories without exactly this kind of gate.
    #
    # So a pull request from a fork skips every GPU leg. It still gets the
    # guards job on a hosted runner, which is ephemeral and disposable. The
    # conformance run happens when a maintainer pushes the branch to this
    # repository, which is also when somebody has read the diff.
    #
    # Setting this repository's Actions policy to require approval for all
    # outside collaborators is the second layer and is set in the web UI, not
    # here. Do both: an approval is a human being clicking a button while
    # tired, and this condition is not.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Both legs are the same physical machine. Running them at once would have
      # two builds competing for the same disk and two suites competing for the
      # same driver, and a timing-sensitive failure there is not a real one.
      max-parallel: 1
      matrix:
        include:
          - name: nvidia-4090
            gpu_index: 0
          - name: amd-igpu
            gpu_index: 1
    env:
      # The engine reads its device from the environment rather than a flag, so
      # a leg is a variable and nothing in the build has to know about CI.
      REVENANT_GPU_INDEX: ${{ matrix.gpu_index }}
      # The GPU cases skip when there is no device, so that a developer without
      # Vulkan still gets the CPU-side suite. That would let a runner whose
      # driver had quietly died report a green build having tested nothing on
      # the GPU at all. Here the device is the entire point, so its absence is
      # a failure with a reason rather than a skip.
      REVENANT_REQUIRE_GPU: "1"
      # Nothing here is hosted, so the GitHub Actions cache backend is the wrong
      # store: it would upload to GitHub and download again on the same machine
      # that built the packages. A directory on the runner's own disk, outside
      # the workspace, survives the clean checkout below.
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache\revenant
    steps:
      # The default clean checkout wipes build/ and vcpkg_installed/ between
      # runs. That is deliberate: a stale build directory on a long-lived runner
      # produces failures nobody can reproduce. The binary cache above is what
      # keeps the cost of that down.
      - uses: actions/checkout@v4

      - name: Create the vcpkg binary cache directory
        shell: pwsh
        run: |
          # vcpkg refuses to start when VCPKG_DEFAULT_BINARY_CACHE names a path
          # that does not exist, and the message does not say which variable.
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "binary cache: $env:VCPKG_DEFAULT_BINARY_CACHE"

      # vcpkg is installed on the runner at C:\vcpkg with VCPKG_ROOT set, and the
      # preset's toolchain file picks it up from there. lukka/run-vcpkg would
      # clone a second copy and pin a different baseline than
      # vcpkg-configuration.json.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1, pinned: this one is not GitHub's and it runs on the workstation
        with:
          arch: x64

      - name: Which device this leg is bound to
        shell: pwsh
        run: |
          # Index 0 is the RTX 4090, index 1 the Radeon integrated part. Printed
          # because a driver update that reorders enumeration would otherwise
          # silently run the same device twice.
          "REVENANT_GPU_INDEX = $env:REVENANT_GPU_INDEX (${{ matrix.name }})"

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      # --no-tests=error, because a bare ctest prints "No tests were found!!!"
      # and exits 0. Measured, not assumed: an empty CTestTestfile.cmake gives
      # exit 0 bare and exit 8 with the flag. Without it, a tests/CMakeLists.txt
      # that stopped registering targets would turn this job from a conformance
      # gate into a compile check, and the only sign would be a run that got
      # faster.
      #
      # What it catches is zero tests, not too few. catch_discover_tests
      # registers one ctest entry per Catch2 case, so the count moves with every
      # commit and a floor on it would be a number somebody has to keep pushing
      # up. Losing one target out of six while five still register is not
      # covered here; it is covered by the suite's own coverage of what those
      # targets test.
      - name: Test
        run: ctest --preset ci --no-tests=error

      # A red conformance run is expensive to reproduce: it needs this machine,
      # this driver and this device. Keeping the diff output means the next step
      # is reading it rather than booking the workstation.
      - name: Reference-diff output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-diff-${{ matrix.name }}
          path: |
            build/ci/Testing/**/*.log
          if-no-files-found: warn
          retention-days: 14

      # The engine half of the installer payload, from one leg only. Both legs
      # build the same binary against the same preset and differ solely in
      # which GPU the suite ran against, so uploading from each would be two
      # artifacts racing for one name. See docs/packaging.md.
      - name: Stage the engine half of the payload
        if: matrix.name == 'nvidia-4090'
        shell: pwsh
        run: ./scripts/stage-payload.ps1 -Only engine -Out dist/engine -Clean

      - name: Upload the engine half
        if: matrix.name == 'nvidia-4090'
        uses: actions/upload-artifact@v4
        with:
          name: payload-engine
          path: dist/engine
          if-no-files-found: error
          retention-days: 7

  # Qt must never become load-bearing in core. That requirement does not survive
  # being bolted on after the fact: by the time anyone checks, a header has been
  # included somewhere quiet and the dependency is structural. So it is gated
  # from the first commit rather than from the first release.
  #
  # This job needs no GPU, but the only self-hosted Windows runner is the GPU
  # workstation, so it carries the same labels.
  headless:
    needs: guards
    runs-on: [self-hosted, windows, x64, gpu]

    # The same gate as build-and-test, for the same reason. See the long note
    # there; this job needs no GPU but runs on the same physical machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache\revenant
    steps:
      - uses: actions/checkout@v4

      - name: Create the vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1, pinned: this one is not GitHub's and it runs on the workstation
        with:
          arch: x64

      - name: Configure with the UI excluded
        run: cmake --preset headless

      - name: Build
        # Numerics are covered by the two GPU legs above. This job is here to
        # prove the Qt boundary holds, so it builds and stops.
        run: cmake --build --preset headless

  # The Qt client, which until this job existed was the part of the tree CI
  # did not configure at all. ui/ is a second CMake project, built against the
  # dynamic vcpkg triplet because Qt 6.8.3 is, and the root CMakeLists.txt
  # refuses REVENANT_BUILD_UI for that reason: one cache cannot hold both
  # runtimes. So it needs a job of its own rather than a step in one above.
  #
  # What that bought while it was missing: ui/ carries a whole second
  # application, its one test target had never been run by anybody who merges,
  # and a client that did not compile could reach main without a single red
  # tick. The engine tree's tests say nothing about it, because this project
  # links no part of the engine and talks to it over a socket.
  #
  # Three things this job needs from the runner that the engine legs do not:
  #
  #   Qt 6.8.3 at C:/Qt/6.8.3/msvc2022_64, which ui/CMakePresets.json pins as
  #   CMAKE_PREFIX_PATH. The step below checks for it by hand so a missing Qt
  #   says so in one line rather than as a find_package failure fifty lines
  #   into a configure log.
  #
  #   capnproto and catch2 in the x64-windows triplet, from ui/vcpkg.json.
  #   The engine's legs build the static triplet, so these are a separate set
  #   of packages in the same binary cache.
  #
  #   Nothing else. No GPU: this target links no Vulkan and opens no device.
  #   It runs here because the only self-hosted Windows runner is the GPU
  #   workstation, the same reason the headless job above carries the gpu
  #   label.
  #
  # REVENANT_WERROR=ON to match the engine's ci preset. ui/CMakeLists.txt
  # defaults it off so a developer's first build of the client is not a wall
  # of errors from a Qt header; a merge gate is the other case.
  ui:
    needs: guards
    runs-on: [self-hosted, windows, x64, gpu]

    # The same gate as build-and-test, for the same reason. See the long note
    # there; this job needs no GPU but runs on the same physical machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ui
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache\revenant
    steps:
      - uses: actions/checkout@v4

      - name: Create the vcpkg binary cache directory
        shell: pwsh
        working-directory: .
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Qt is where the preset expects it
        shell: pwsh
        run: |
          # Fail here rather than let find_package do it. The preset pins one
          # exact prefix, so a Qt upgrade on the runner breaks this job and
          # the message should name the path and the file that holds it.
          $prefix = 'C:/Qt/6.8.3/msvc2022_64'
          if (-not (Test-Path "$prefix/lib/cmake/Qt6/Qt6Config.cmake")) {
            Write-Output "Qt 6.8.3 is not at $prefix."
            Write-Output "ui/CMakePresets.json pins CMAKE_PREFIX_PATH to that path."
            Write-Output "Install it with the Qt online installer, or change the preset."
            exit 1
          }
          "Qt found at $prefix"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1, pinned: this one is not GitHub's and it runs on the workstation
        with:
          arch: x64

      - name: Configure
        run: cmake --preset vs -DREVENANT_WERROR=ON

      - name: Build
        run: cmake --build --preset vs

      # revenant_ui_tests only: 26 Catch2 cases over two headless pieces,
      # AudioRing in tests/test_audio_ring.cpp and the waterfall ring
      # arithmetic in tests/test_history_resize.cpp. That is thin and saying
      # so here is the point. It proves nothing about the QML, the scene
      # graph items or the audio device, none of which a headless agent can
      # open, and nothing about render/spectrum_scale.cpp, which is pure
      # arithmetic with no Qt type in it and simply has no test yet.
      # docs/ci.md lists what is unguarded, file by file.
      #
      # WHAT THIS COMMENT USED TO SAY: "one file over AudioRing". There are
      # two files and the second is not AudioRing. The job and the second test
      # file were written thirteen minutes apart on two separate lanes and met
      # in a merge, so neither author was wrong when they wrote it and nothing
      # re-read the sentence afterwards. That is the ordinary way a count on
      # one side stops matching the thing on the other.
      #
      # --no-tests=error for the reason given on the engine's Test step, and
      # it matters more here: ui/ has exactly ONE test target, so the empty
      # set is one deleted add_test away rather than six. The step as first
      # written would have gone green on it, which would have undone the point
      # of adding this job at all.
      - name: Test
        run: ctest --test-dir build/vs -C RelWithDebInfo --output-on-failure --no-tests=error

      - name: CTest output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ctest
          path: |
            ui/build/vs/Testing/**/*.log
          if-no-files-found: warn
          retention-days: 14

      # The client half of the installer payload: revenant-ui.exe and the
      # subset of the Qt runtime it was measured to load. The prune happens
      # here rather than in the package job because the windeployqt output is
      # 114 MB and the pruned tree is 63 MB, and this artifact crosses from
      # the workstation to a hosted runner.
      - name: Stage the client half of the payload
        shell: pwsh
        working-directory: .
        run: ./scripts/stage-payload.ps1 -Only client -Out dist/client -Clean

      - name: Upload the client half
        uses: actions/upload-artifact@v4
        with:
          name: payload-client
          path: dist/client
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The installer, unsigned, on every build
  # ---------------------------------------------------------------------------
  #
  # WHY THIS RUNS ON A HOSTED RUNNER. Forging needs no C++ toolchain: lwforge
  # stamps a config and a payload directory into a copy of a prebuilt stub.
  # Nothing here needs the GPU, the Vulkan SDK or Qt, so it does not belong on
  # the workstation, and a fork cannot reach it anyway: it needs two jobs that
  # a fork pull request skips, and a skipped dependency skips this too.
  #
  # WHY UNSIGNED. Payload members are hashed into the container and extracted
  # verbatim, so signing has to happen before the forge step and the certificate
  # is not something a per-commit job should be reaching for. The release job
  # below is where that happens. An installer built here is for testing that the
  # packaging still works, and the stub says UNSIGNED DEV BUILD on its face so
  # it cannot be mistaken for a shipping artifact.
  package:
    needs: [build-and-test, ui]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Pinned, so a Forge release cannot change what this job produces without
      # somebody choosing it. v0.4.0 is the first release that rejects an
      # unknown hook phase and the first with build-time checks on a hook, and
      # installer.toml's [[options]] and `when` need v0.3.0 or later. A pin
      # older than that does not fail: it inverts the feature, and a `when`
      # fires unconditionally. See "Which version has what" in
      # Forge/docs/using-forge-in-ci.md.
      FORGE_VERSION: v0.4.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload-engine
          path: dist/stage

      - uses: actions/download-artifact@v4
        with:
          name: payload-client
          path: dist/stage

      # cmake/RevenantVersion.cmake is the single source of truth and
      # installer.toml carries its own copy, because lwforge reads a TOML file
      # and nothing generates it. Two copies of a version drift, so the drift
      # is what fails here rather than what ships in a version resource that
      # disagrees with Add/Remove Programs.
      - name: The installer version matches the source of truth
        shell: pwsh
        run: |
          $cmake = Get-Content cmake/RevenantVersion.cmake -Raw
          $major = [regex]::Match($cmake, 'REVENANT_VERSION_MAJOR (\d+)').Groups[1].Value
          $minor = [regex]::Match($cmake, 'REVENANT_VERSION_MINOR (\d+)').Groups[1].Value
          $patch = [regex]::Match($cmake, 'REVENANT_VERSION_PATCH (\d+)').Groups[1].Value
          $expected = "$major.$minor.$patch"
          $toml = [regex]::Match((Get-Content installer.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          "cmake $expected, installer.toml $toml"
          if ($toml -ne $expected) {
            throw "installer.toml says $toml and cmake/RevenantVersion.cmake says $expected"
          }

      # Forge is public, so the workflow's own token reads its releases. gh
      # refuses to run with no GH_TOKEN at all and says so before it reaches
      # the network, which reads as a permissions failure and is not one.
      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge `
            --pattern '*.exe' --dir tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "tools/$name"
            "$name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "tools/$name is $($sig.Status)" }
          }

      # --dev, because the payload arriving here was never signed. Without it
      # lwforge refuses the unsigned stub, and with an unsigned payload the
      # honest label is the one the stub prints.
      - name: Forge the installer
        shell: pwsh
        run: |
          ./tools/lwforge.exe build `
            --config installer.toml `
            --payload dist/stage `
            --stub tools/lwstub.exe `
            --out dist/Revenant-Setup.exe `
            --dev

      # Two checks. inspect proves the container is readable, which is the one
      # that matters once a signature is appended in the release job below.
      # --check-only lists the option set this installer declares, which is the
      # only way a deployment tool's /O: switches can be confirmed against the
      # spelling this version uses. It exits 1603 both for an option id that
      # does not exist and for a preflight the runner fails, so print the
      # report: the text distinguishes them and the code does not.
      - name: Verify
        shell: pwsh
        run: |
          ./tools/lwforge.exe inspect dist/Revenant-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "the installer cannot read its own container" }

          $report = & ./dist/Revenant-Setup.exe --check-only /O:desktop_shortcut=off 2>&1 | Out-String
          $report
          if ($LASTEXITCODE -ne 0) { throw "check-only exited $LASTEXITCODE`n$report" }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Revenant-Setup-unsigned
          path: dist/Revenant-Setup.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The signed installer, on a version tag
  # ---------------------------------------------------------------------------
  #
  # Nothing in this job has run. It is wired so that it can, and the first tag
  # is when it is exercised for real.
  #
  # THE ORDER IS THE WHOLE POINT. The payload is signed first, because lwforge
  # hashes those files into the container and the stub extracts them byte for
  # byte: an unsigned binary going in is an unsigned binary on the customer's
  # disk, and signing the finished installer does nothing for it. The installer
  # is signed last, after resource stamping and after the container is
  # appended, because the signature is what makes the bytes immutable. The
  # embedded uninstaller is the stub itself, added as a payload member at
  # .lw\uninstall.exe and never re-signed on the way out, which is why the
  # release stub is fetched rather than built.
  #
  # Authentication is three values and nothing else: a user principal with a
  # client secret. There is no OIDC subject, no federated credential and no
  # azure/login step, and looking for one has already cost a day against a
  # configuration that was never broken.
  release:
    needs: [build-and-test, ui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      FORGE_VERSION: v0.4.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload-engine
          path: dist/stage

      - uses: actions/download-artifact@v4
        with:
          name: payload-client
          path: dist/stage

      # signing/signing.env is the one place the endpoint, the account and the
      # certificate profile are written down, and the reason it exists is that
      # the profile name drifted into three different answers across four
      # other repositories once it was copied. Writing the literals into this
      # file would be that copy. A variable of the same name in the
      # environment wins, which is how a different profile gets selected
      # without editing a tracked file.
      - name: Read the signing configuration
        id: signing
        shell: pwsh
        run: |
          $wanted = @{
            REVENANT_SIGN_ENDPOINT = 'endpoint'
            REVENANT_SIGN_ACCOUNT  = 'account'
            REVENANT_SIGN_PROFILE  = 'profile'
          }
          $found = @{}
          foreach ($line in Get-Content signing/signing.env) {
            if ($line -match '^\s*#' -or $line -notmatch '=') { continue }
            $name, $value = $line -split '=', 2
            $name = $name.Trim()
            if (-not $wanted.ContainsKey($name)) { continue }
            $override = [Environment]::GetEnvironmentVariable($name)
            $found[$name] = if ($override) { $override } else { $value.Trim() }
          }
          foreach ($name in $wanted.Keys) {
            if (-not $found.ContainsKey($name) -or -not $found[$name]) {
              throw "signing/signing.env does not set $name"
            }
            "$($wanted[$name])=$($found[$name])" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }
          $found.GetEnumerator() | ForEach-Object { "$($_.Key) = $($_.Value)" }

      - name: Sign the payload
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ steps.signing.outputs.endpoint }}
          trusted-signing-account-name: ${{ steps.signing.outputs.account }}
          certificate-profile-name: ${{ steps.signing.outputs.profile }}
          files-folder: dist/stage
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          # Certificates last three days. Without a timestamp the signature
          # stops validating inside the week. Not optional.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The action exiting zero is not the same as the files being signed. A
      # wrong filter or a folder it never reached looks identical from the
      # outside, and the failure surfaces on somebody else's machine.
      - name: Every payload binary is signed
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem dist/stage -Recurse -Include *.exe, *.dll | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { $bad += "$($_.Name): $($sig.Status)" }
          }
          if ($bad.Count -gt 0) { throw "unsigned payload members:`n" + ($bad -join "`n") }

      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge `
            --pattern '*.exe' --dir tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "tools/$name"
            "$name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "tools/$name is $($sig.Status)" }
          }

      # No --dev here and no --sign either. --sign shells out to
      # scripts/sign.ps1 resolved against the working directory, which exists
      # only in the Forge repository, and the failure it produces reads like a
      # certificate problem.
      - name: Forge the installer
        shell: pwsh
        run: |
          ./tools/lwforge.exe build `
            --config installer.toml `
            --payload dist/stage `
            --stub tools/lwstub.exe `
            --out dist/Revenant-Setup.exe

      - name: Sign the installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ steps.signing.outputs.endpoint }}
          trusted-signing-account-name: ${{ steps.signing.outputs.account }}
          certificate-profile-name: ${{ steps.signing.outputs.profile }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The publisher reads Specter Point Intelligence, LLC. That is the parent
      # organisation and a Locke Werks product signed by it is correct.
      #
      # The inspect is the check people leave out. Signing appended a
      # certificate table after the container, and this is what proves the
      # payload is still reachable behind it rather than orphaned.
      - name: Verify
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/Revenant-Setup.exe
          "installer: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "the installer is $($sig.Status)" }

          ./tools/lwforge.exe inspect dist/Revenant-Setup.exe
          if ($LASTEXITCODE -ne 0) {
            throw "the signed installer cannot read its own container"
          }

      # THIS STEP IS NOT YET COMPLETE AND THE GAP IS A LICENCE ONE, NOT A
      # PACKAGING ONE. Revenant is GPL-3.0-or-later and links libusb under
      # LGPL-2.1-or-later. docs/clean-room.md decided on 2026-09-20 that both
      # obligations are discharged by section 6d, which is the binary and the
      # corresponding sources offered from the same designated place. A
      # release carrying only the installer is not that. What is missing is
      # listed in docs/packaging.md under "What the container does not carry
      # yet", and the first tag is when it comes due.
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Revenant-Setup.exe `
            --repo "${{ github.repository }}" `
            --title "Revenant ${{ github.ref_name }}"
