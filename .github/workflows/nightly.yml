name: nightly

on:
  schedule:
    # 09:00 UTC, which is the small hours in US Central. GitHub cron is always
    # UTC and does not follow daylight saving, so this drifts by an hour twice a
    # year. That is fine for a sweep.
    #
    # A scheduled workflow on a self-hosted runner only fires when the machine
    # is on. That is a known and accepted property of running the conformance
    # hardware on a workstation, not a fault to chase: a missed night is a night
    # the box was off. GitHub also disables scheduled workflows in a repository
    # with no activity for 60 days, which shows up the same way.
    - cron: '0 9 * * *'
  workflow_dispatch:

# A sweep can run for hours. A second one queued behind it waits rather than
# killing it, which is the opposite of what ci.yml wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fixed on purpose. Every random draw in the project takes an explicit seed,
  # never a clock, so a curve is reproducible from the number printed in the
  # log. A regression found here is rerun locally with this same value.
  REVENANT_BENCH_SEED: '20260918'

jobs:
  # The long BER against SNR sweeps. These do not belong in a per-PR gate: they
  # take too long to sit in front of a review, and a curve moving is a different
  # kind of news from a kernel disagreeing with its reference.
  #
  # One device. Until 2026-09-22 this was a matrix with a second leg on the
  # Radeon integrated graphics, which is no longer supported or tested; ci.yml
  # says why at build-and-test. The index is pinned because that part is still
  # in the machine.
  sweep:
    name: sweep (nvidia-4090)
    runs-on: [self-hosted, windows, x64, gpu]
    timeout-minutes: 240
    env:
      REVENANT_GPU_INDEX: "0"
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache\revenant
    steps:
      - uses: actions/checkout@v4

      - name: Create the vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1, pinned: this one is not GitHub's and it runs on the workstation
        with:
          arch: x64

      # RelWithDebInfo, the same preset CI builds. A sweep measured against a
      # debug build would say nothing about the code that ships.
      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Locate the bench tool and the baseline
        id: preflight
        shell: pwsh
        run: |
          # A missing tool or baseline is a warning and a skipped sweep rather
          # than a failure. A red nightly every night trains everyone to ignore
          # the workflow, and the thing worth being loud about is a curve that
          # moved, not scaffolding that has not caught up yet.
          $tool = Get-ChildItem -Path build/ci -Recurse -File -Filter 'bench.exe' `
                    -ErrorAction SilentlyContinue | Select-Object -First 1
          $baseline = 'tests/baselines/ber-vs-snr.json'

          $missing = @()
          if (-not $tool) { $missing += 'build/ci/**/bench.exe' }
          if (-not (Test-Path $baseline)) { $missing += $baseline }

          if ($missing) {
            Write-Output "::warning::nightly sweep skipped, not built yet: $($missing -join ', ')"
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'ready=false'
            exit 0
          }

          "tool:     $($tool.FullName)"
          "baseline: $baseline"
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'ready=true'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tool=$($tool.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "baseline=$baseline"

      - name: Sweep BER against SNR
        if: steps.preflight.outputs.ready == 'true'
        shell: pwsh
        run: |
          # Two calls, because the tool separates producing a curve from judging
          # one. The judgement lives in the tool and not in this YAML: it knows
          # what a tolerable per-point worsening is and how to interpolate the
          # sensitivity shift in dB, which is the number a person actually cares
          # about. A step comparing columns here would be a second, worse copy
          # of that.
          #
          # The subject under test is a CPU BPSK demodulator, so the curve does
          # not depend on the device at all. When decoders become GPU kernels
          # the device starts to matter and this comment should be revisited
          # rather than trusted.
          New-Item -ItemType Directory -Force -Path bench-out | Out-Null
          $curve = "bench-out/ber-vs-snr-nvidia-4090.json"
          "device: $env:REVENANT_GPU_INDEX   seed: $env:REVENANT_BENCH_SEED"

          & '${{ steps.preflight.outputs.tool }}' sweep `
              --snr-start -4 --snr-stop 10 --snr-step 1 `
              --trials 10000 `
              --seed $env:REVENANT_BENCH_SEED `
              --commit $env:GITHUB_SHA `
              --out $curve
          if ($LASTEXITCODE -ne 0) { throw "sweep exited $LASTEXITCODE" }

          # Exit 1 is a regression, 2 bad usage, 3 an error while running. Only
          # the first is a statement about the code under test, but all three
          # fail the job: a comparison that could not run has not cleared
          # anything.
          & '${{ steps.preflight.outputs.tool }}' compare `
              '${{ steps.preflight.outputs.baseline }}' $curve
          if ($LASTEXITCODE -ne 0) { throw "compare exited $LASTEXITCODE" }

      # The first decoder with a curve: core/decode/rds_bits.h against the RDS
      # transmitter, on the same Eb/N0 axis. Runs whether or not the BPSK step
      # passed, because the two measure different code and a regression in one
      # is no reason to stop looking at the other.
      #
      # --min-bit-errors 0 because a bit slip after lock scores the rest of a
      # trial as errors, so one trial can end a point early and the early stop
      # would then measure that trial rather than the decoder. 1024 trials of
      # 4096 bits took 226 s on the RTX 4090 workstation's CPU on 2026-09-22.
      # The baseline was made with this seed and these arguments; change one
      # and regenerate it, or the comparison measures the change.
      - name: Sweep the RDS decoder
        if: steps.preflight.outputs.ready == 'true' && !cancelled()
        shell: pwsh
        run: |
          $baseline = 'tests/baselines/ber-vs-snr-rds.json'
          if (-not (Test-Path $baseline)) {
            Write-Output "::warning::RDS sweep skipped, $baseline is missing"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path bench-out | Out-Null
          $curve = "bench-out/ber-vs-snr-rds-nvidia-4090.json"

          & '${{ steps.preflight.outputs.tool }}' sweep --mode rds `
              --snr-start 2 --snr-stop 12 --snr-step 1 `
              --trials 1024 --min-bit-errors 0 `
              --seed $env:REVENANT_BENCH_SEED `
              --commit $env:GITHUB_SHA `
              --out $curve
          if ($LASTEXITCODE -ne 0) { throw "sweep exited $LASTEXITCODE" }

          & '${{ steps.preflight.outputs.tool }}' compare $baseline $curve
          if ($LASTEXITCODE -ne 0) { throw "compare exited $LASTEXITCODE" }

      # Every other decoder with a transmitter, tools/bench/mode_subjects.h,
      # each against tests/baselines/ber-vs-snr-<mode>.json. The grid, trial
      # count, payload and early stop live in the subject, so the command is
      # the same for every mode and is the one docs/sensitivity.md gives; the
      # baselines were made with it and this seed. compare reads each curve at
      # its mode's own error rate, 0.01 for every one of them today.
      #
      # A mode whose baseline is missing is skipped with a warning, as the RDS
      # step does. A mode that regresses does not stop the loop: every mode is
      # swept and compared, and the step fails at the end naming each one,
      # because a regression in one decoder is no reason to stop looking at
      # the next.
      #
      # Runtime, measured on 2026-09-23 making the baselines on the RTX 4090
      # workstation's CPU with other builds running on it: 664 s for all
      # fifteen, of which navtex took 151 s, qpsk31 134 s, psk31 91 s, cw
      # 69 s, sitor-b 68 s and psk63 54 s, and the other nine under 45 s
      # each. dmr, the sixteenth, took 4 s making its baseline later that
      # day, and ais and dsc 0.7 s and 4.2 s. With the RDS step's 226 s and the BPSK sweep's fraction of a
      # second, the sweeps in this job come to about 15 minutes, so every
      # mode runs every night. If they pass 30 minutes, the rule is to split
      # this list across alternate nights by family, the audio modes one
      # night and the complex baseband ones the next, rather than to cut
      # trials, because the trial counts are what make the tails of these
      # curves a rate rather than a coincidence.
      - name: Sweep the decoders
        if: steps.preflight.outputs.ready == 'true' && !cancelled()
        shell: pwsh
        run: |
          $modes = 'rtty', 'ax25', 'pocsag-512', 'pocsag-1200', 'pocsag-2400', 'sitor-b', 'navtex',
                   'psk31', 'psk63', 'qpsk31', 'cw', 'm17', 'p25p1', 'dstar', 'tetra', 'dmr',
                   'ais', 'dsc'
          New-Item -ItemType Directory -Force -Path bench-out | Out-Null
          $failed = @()
          $all = [System.Diagnostics.Stopwatch]::StartNew()
          foreach ($mode in $modes) {
            $baseline = "tests/baselines/ber-vs-snr-$mode.json"
            if (-not (Test-Path $baseline)) {
              Write-Output "::warning::$mode sweep skipped, $baseline is missing"
              continue
            }
            $curve = "bench-out/ber-vs-snr-$mode-nvidia-4090.json"
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            & '${{ steps.preflight.outputs.tool }}' sweep --mode $mode `
                --seed $env:REVENANT_BENCH_SEED `
                --commit $env:GITHUB_SHA `
                --out $curve
            if ($LASTEXITCODE -ne 0) {
              $failed += "$mode (sweep exited $LASTEXITCODE)"
              continue
            }
            & '${{ steps.preflight.outputs.tool }}' compare $baseline $curve
            if ($LASTEXITCODE -ne 0) { $failed += "$mode (compare exited $LASTEXITCODE)" }
            "{0}: {1:N0} s" -f $mode, $clock.Elapsed.TotalSeconds
          }
          "all decoders: {0:N0} s" -f $all.Elapsed.TotalSeconds
          if ($failed) { throw "decoder sweeps failed: $($failed -join ', ')" }

      # Uploaded whether or not the comparison passed. A passing curve is the
      # record of where the numbers were on a given night, and a failing one is
      # the evidence of what moved. The committed baseline under tests/baselines
      # is updated deliberately, by hand, from a curve somebody has read.
      - name: Curves
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-curves-nvidia-4090
          path: bench-out/**
          if-no-files-found: warn
          retention-days: 90
