# The Forge installer for Revenant.
#
# Forge is C:\Users\vexam\projects\Forge, remote Locke-Werks/Forge. One signed
# stub, plus lwforge, which stamps this file and a payload directory into a
# copy of it. docs/config-schema.md over there is the key surface; every
# decision below cites it or a measurement recorded in docs/packaging.md.
#
# The payload is assembled by scripts/stage-payload.ps1 and is not described
# here: lwforge takes a directory and hashes what it finds. docs/packaging.md
# says what is in that directory and why.
#
# PATHS ARE LITERAL STRINGS, IN SINGLE QUOTES. A TOML basic string processes
# escapes, so "{InstallDir}\bin" is InstallDir, then a BACKSPACE, then "in".
# lwforge rejects control characters and names the offender, so the mistake
# fails the build rather than shipping, but the single quotes stop it being
# made. See "Backslashes" in docs/config-schema.md.

[product]
name        = "Revenant"
version     = "0.3.14"
publisher   = "Locke Werks"
description = "A GPU-resident software defined radio"
copyright   = "Copyright (c) 2026 Locke Werks"
url         = "https://github.com/Locke-Werks/Revenant"
icon        = "assets/revenant.ico"

# AppUserModelID, with no version component, which is what keeps a taskbar pin
# and a toast working across an upgrade. docs/config-schema.md, [product].
aumid = "LockeWerks.Revenant"

# upgrade_code MUST NEVER CHANGE.
#
# It is stable across versions and keys the single-instance mutex
# (Global\lwi-<upgrade_code> in the stub), so two Revenant installers of any
# version refuse to run at once with exit code 1618 instead of racing over one
# install directory. Changing it after an installer carrying it has reached
# anybody makes the new installer a stranger to the old one: both would run at
# once again. Generated fresh on 2026-09-22 with [guid]::NewGuid(), before any
# release, which is the one moment it could be chosen. Nothing else in this
# file or in Forge derives from it, so there is no second copy to keep in step.
upgrade_code = "d4be342a-9c6c-4c6b-9fd7-848637a79967"

[install]
scope = "machine"
dir   = '{ProgramFiles}\Revenant'

# The default, stated rather than inherited. A machine-scope install writes to
# Program Files, so it has to elevate, and on-demand would only mean the stub
# does not elevate itself and then dies at the first write. docs/config-schema.md,
# [install].
elevation = "required"

[ui]
# The GPL's own notice, not a EULA. Forge requires the checkbox before the
# install proceeds, which is a property of the installer and not a condition
# the licence imposes: nothing here asks anybody to accept anything in order
# to run the program. The full text installs beside the binaries as
# LICENSE.txt, so a recipient with no network still has the terms.
license_text = """
Revenant is free software: you can redistribute it and/or modify it under the
terms of the GNU General Public License as published by the Free Software
Foundation, either version 3 of the License, or (at your option) any later
version.

This program is distributed in the hope that it will be useful, but WITHOUT
ANY WARRANTY, without even the implied warranty of MERCHANTABILITY or FITNESS
FOR A PARTICULAR PURPOSE. See the GNU General Public License for more detail.

The complete licence text is installed as LICENSE.txt beside the programs.
The components Revenant includes from other projects, and their licences, are
listed in THIRD-PARTY-NOTICES-engine.txt and THIRD-PARTY-NOTICES-client.txt
beside it. The corresponding source of this release, with the copyleft
libraries it links, is published beside the installer on the release page at
https://github.com/Locke-Werks/Revenant/releases.
"""

# ---------------------------------------------------------------------------
# What the person installing gets asked
# ---------------------------------------------------------------------------
#
# Two options. Each one is a checkbox, a command-line switch, a manifest key and
# a thing to keep spelled the same across versions, so the bar for adding
# another is that the product genuinely wants it either way.
#
# PATH was considered and is not here. docs/config-schema.md lists the
# declarations that expand {InstallDir}, and path_append's value is not among
# them, so an entry would put the literal string {InstallDir} into the user's
# PATH. That is the failure the token table warns about, and it is silent.

[[options]]
id      = "desktop_shortcut"
label   = "Put a Revenant shortcut on the desktop"
detail  = "The Start Menu entry is created either way."
default = false

# The phone gateway at sign-in. On by default because the owner asked for it,
# 2026-11-03: "gateway should start at windows login." It costs nothing idle:
# the gateway starts no engine until a phone connects and stops the one it
# started once no phone holds it (docs/webgate.md, "Cold start").
[[options]]
id      = "gateway_at_signin"
label   = "Start the Revenant phone gateway when anyone signs in"
detail  = "Runs in the background with no window. The radio and GPU are used only while a phone is connected."
default = true

# ---------------------------------------------------------------------------
# Whether the machine qualifies
# ---------------------------------------------------------------------------

[[preflight]]
type = "os_build"
min  = 22000
fail = "Revenant needs Windows 11. This machine reports an older build."

[[preflight]]
# 160.1 MB extracted, measured 2026-11-02 by scripts/stage-payload.ps1 with the
# web gateway and its web app in the payload, plus the installer's own copy of
# the container and the rollback journal beside it. 512 MB is that with room
# for a payload that grows before anyone revisits the number, and it is small
# enough that no real machine fails it by surprise.
type  = "free_disk_space"
bytes = 536870912
fail  = "Revenant needs about 512 MB free on the install volume."

# THE RUNNING COPY, AND WHY THIS IS A PREFLIGHT RATHER THAN A pre_install HOOK.
#
# An upgrade that swaps the files under a running engine leaves every client
# talking to an image held open out of a renamed backup. Forge offers two ways
# to stop that and docs/config-schema.md says to pick one, because a
# process_not_running preflight refuses the install before any hook can run.
#
# The hook route needs a payload member that stops the product, depends on
# nothing but the operating system and itself, and is signed before staging.
# For the engine and the desktop no such binary exists, so the preflight route
# it is. The phone gateway is the exception: it can stop itself, see Hooks.
#
# A RUNNING COPY IS A REFUSAL, NOT AN OFFER. restart_manager = true sets a
# `recoverable` flag on the outcome and nothing in the stub reads it: there is
# no RmShutdown anywhere in Forge v0.4.0 or in its tree at 544533e, and
# has_blocking_failure counts the check as a plain failure. So the person
# installing gets the fail message below, exit 1603, and has to close the
# program themselves. The match is on the image name across every process on
# the machine, in any session and from any path: on 2026-09-23 --check-only
# failed here on an engine running out of another checkout's build tree. The
# key stays because it costs nothing and is what a Forge that grows the close
# will read.
#
# WHAT THIS PARAGRAPH USED TO SAY: "The preflight route costs nothing to ship
# and, with restart_manager, hands the user the option rather than a dead
# end." It never did. Forge's docs/config-schema.md describes the key that way
# and the stub does not implement it.
[[preflight]]
type            = "process_not_running"
name            = "revenant-engine.exe"
restart_manager = true
fail            = "The Revenant engine is running. Close it and the install can continue."

# NO PREFLIGHT FOR THE PHONE GATEWAY: the pre_install hook below stops it.
# It runs at every sign-in with no window, so a refusal would send everyone
# upgrading to Task Manager. docs/config-schema.md says to pick one of the
# preflight and the hook, because the preflight refuses before any hook runs.

[[preflight]]
type            = "process_not_running"
name            = "revenant-ui.exe"
restart_manager = true
fail            = "Revenant is running. Close the window and the install can continue."

# NO VULKAN PREFLIGHT, WHICH IS A DECISION AND NOT AN OVERSIGHT.
#
# The engine imports vulkan-1.dll: dumpbin /dependents on revenant-engine.exe
# lists WS2_32, bcrypt, SHELL32, ADVAPI32, ole32, vulkan-1, WINHTTP and
# KERNEL32, and nothing else; WINHTTP since 2026-10-03, for the speech model's
# first-use download, and it is part of Windows. A file_exists preflight on the loader would therefore predict a
# real startup failure. It would also block the client, which is a remote user
# interface that reaches an engine over a socket and has every reason to be
# installed on a machine that will never open a GPU.

# ---------------------------------------------------------------------------
# What the install writes outside its own directory
# ---------------------------------------------------------------------------
#
# Everything here is captured before it is written and restored on uninstall.
# That is the reason to prefer a declaration over a hook wherever a hook would
# do: a hook is an opaque signed binary and the engine cannot undo it.

[[actions]]
type = "arp"

[[actions]]
type   = "shortcut"
target = '{InstallDir}\revenant-ui.exe'
name   = "Revenant"

[[actions]]
type   = "shortcut"
where  = "desktop"
target = '{InstallDir}\revenant-ui.exe'
name   = "Revenant"
when   = "desktop_shortcut"

[[actions]]
type   = "shortcut"
target = '{InstallDir}\revenant-webgate.exe'
name   = "Revenant phone gateway"

# THE PHONE GATEWAY AT SIGN-IN, AND WHY HKLM RUN.
#
# HKLM\...\Run starts the program at every user's sign-in, as that user, in
# their session. That is the shape the gateway needs: it reads the signed-in
# person's engine token and desktop settings under their own %LOCALAPPDATA%
# and HKCU, and its single-instance mutex is per session (Local\). HKCU\...\Run
# is not an option from here: this installer runs elevated, and under
# over-the-shoulder UAC HKCU is the administrator's hive, not the person's.
# The value is the quoted path, because Program Files has a space in it.
# Captured before writing and removed on uninstall like every action.
[[actions]]
type       = "registry_write"
hive       = "HKLM"
key        = 'Software\Microsoft\Windows\CurrentVersion\Run'
name       = "Revenant phone gateway"
value      = '"{InstallDir}\revenant-webgate.exe"'
value_type = "sz"
when       = "gateway_at_signin"

# NO SERVICE. The engine holds a GPU context and a radio, and a machine-wide
# service would hold both against whoever is logged in. The engine is started
# by the desktop, or by the phone gateway when a phone connects and nothing
# else has one running; the gateway runs per sign-in session, not as a
# service, and stops the engine it started once no phone holds it. With two
# people signed in at once, the first one's gateway holds ports 17700 and
# 17701 and the second one's fails to bind them and exits, saying so in its
# log: phones reach the first person's gateway, signed in or disconnected.
# The engine's port and lease arbitrate the radio, as they do between the
# desktop and a phone.
#
# NO FIREWALL RULE FOR THE PHONE GATEWAY.
#
# revenant-webgate.exe and its web/ directory ride in the payload beside the
# engine, and it listens on 0.0.0.0:17700 and 17701. Forge has no firewall
# action, and a hook can only run a digest-pinned payload member, so adding a
# rule would mean shipping and signing a helper exe whose only job is to run
# netsh. The gateway's first start, at the next sign-in or from the Start
# menu, raises Windows' own "allow access" prompt, which offers Private
# networks by default; docs/webgate.md gives the netsh line for a machine
# where that prompt was dismissed or never appears.
#
# NO FILE ASSOCIATIONS. The file source reads SigMF and RIFF WAV recordings, and
# .wav belongs to whatever a person already plays audio with. Registering it,
# even additively through OpenWithProgids, puts Revenant in a list where nobody
# asked for it.
#
# ---------------------------------------------------------------------------
# Hooks
# ---------------------------------------------------------------------------
#
# ONE PROGRAM, TWO PHASES: STOPPING THE PHONE GATEWAY.
#
# `revenant-webgate.exe --stop` sets each running gateway's own stop event,
# in that gateway's session, after checking the event's owner is that
# gateway's account, then waits up to 10 s for each revenant-webgate.exe on
# the machine to exit and terminates any still running (tools/webgate/host.h).
# A gateway exiting, or terminated, ends any engine it started through its Job
# object, so the engine's files are released too; an engine somebody else
# started is still the preflight's to refuse.
#
# pre_install, so it runs before any file is swapped. That phase places this
# one binary first and runs it from the install directory, so it must load
# nothing from the payload: dumpbin /dependents on revenant-webgate.exe, ci
# preset, 2026-11-03, lists bcrypt, SHELL32, ADVAPI32, IPHLPAPI, WS2_32,
# CRYPT32, MFPlat, ole32, KERNEL32 and USER32, all Windows, and the CRT and
# OpenSSL are linked statically. On a fresh install there is nothing to stop
# and it exits 0. On an upgrade the copy placed first is the new one, which is
# what --stop needs: the signal is the same name in every version that has it.
#
# as = "installer", not "user". Gateways run in every signed-in user's
# session, and only the elevated installer may open another account's
# process and its session's event; each event's DACL grants Administrators
# set and wait, and nobody but the gateway's own account besides.
#
# vital on install: a gateway still running when the files are replaced keeps
# the old image, and its engine the old engine. Refusing is the better
# failure; the hook's output says how many were left.
[[hooks.pre_install]]
id         = "stop-phone-gateway"
run        = "payload:revenant-webgate.exe"
args       = ["--stop"]
sha256     = "auto"
timeout_ms = 30000
vital      = true

# The uninstaller cannot delete an image that is running. Not vital in effect
# (an uninstall never stops for a hook), but vital so a deployment tool sees
# a dirty removal in the exit code.
[[hooks.pre_uninstall]]
id         = "stop-phone-gateway"
run        = "payload:revenant-webgate.exe"
args       = ["--stop"]
sha256     = "auto"
timeout_ms = 30000
vital      = true

# Nothing else needs code to run. The RPC token is created by the engine on
# first run under the invoking user's own %LOCALAPPDATA%, which is the one
# place an elevated installer must not write.
