<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revenant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover">
<script>
// iOS fixes the layout viewport's width from the first layouts and does not
// narrow it again, so whatever is wide must be caught while it is. Records
// the widest page seen in the first 3 s and what stuck out at that moment,
// for the ?insets ruler.
(function () {
  var w = { maxScrollWidth: 0, at: 0, items: [] };
  window.__wideAtLoad = w;
  var t0 = Date.now();
  function label(el) {
    var c = typeof el.className === "string" && el.className ? "." + el.className.trim().split(" ").join(".") : "";
    return el.tagName.toLowerCase() + (el.id ? "#" + el.id : "") + c;
  }
  function look() {
    var root = document.documentElement;
    if (!root) return;
    var sw = root.scrollWidth;
    if (sw <= w.maxScrollWidth) return;
    w.maxScrollWidth = sw;
    w.at = Date.now() - t0;
    var limit = window.innerHeight >= window.innerWidth ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    var out = [];
    var all = document.querySelectorAll("body *");
    for (var i = 0; i < all.length; i++) {
      var r = all[i].getBoundingClientRect();
      if (r.right > limit + 0.5) {
        var cs = getComputedStyle(all[i]);
        out.push({ label: label(all[i]), width: r.width, right: r.right, css: cs.width + " min " + cs.minWidth });
      }
    }
    out.sort(function (a, b) { return b.right - a.right; });
    w.items = out.slice(0, 8);
  }
  function frame() {
    look();
    if (Date.now() - t0 < 3000) requestAnimationFrame(frame);
    else save();
  }
  // Every launch is kept, the last three, so the ruler (which reloads with
  // the overlay on) can show what a launch without it looked like.
  // Read at load: the three-finger tap sets the flag just before reloading,
  // so reading it later would mark this launch as a ruler launch.
  var overlay = false;
  try {
    overlay = location.search.indexOf("insets") >= 0 || localStorage.getItem("revenant.insets") === "1";
  } catch (e) {
    overlay = location.search.indexOf("insets") >= 0;
  }
  var saved = false;
  function insets() {
    if (!document.body) return null;
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0";
    document.body.appendChild(p);
    var cs = getComputedStyle(p);
    var r = { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
    p.remove();
    return r;
  }
  function save() {
    if (saved) return;
    saved = true;
    try {
      var list = JSON.parse(localStorage.getItem("revenant.wideLaunches") || "[]");
      if (!Array.isArray(list)) list = [];
      list.push({ t: t0, overlay: overlay, maxScrollWidth: w.maxScrollWidth, at: w.at, items: w.items,
        scale: window.visualViewport ? visualViewport.scale : null, innerWidth: window.innerWidth,
        innerHeight: window.innerHeight, screenHeight: screen.height, screenWidth: screen.width,
        insets: insets(), savedAt: Date.now() - t0 });
      localStorage.setItem("revenant.wideLaunches", JSON.stringify(list.slice(-3)));
    } catch (e) {
      // No storage: the current launch is still in window.__wideAtLoad.
    }
  }
  // A three-finger tap inside the first 3 s reloads before the frame loop
  // ends; the record goes out on the way.
  window.addEventListener("pagehide", save);
  document.addEventListener("DOMContentLoaded", look);
  window.addEventListener("load", look);
  requestAnimationFrame(frame);
})();
</script>
